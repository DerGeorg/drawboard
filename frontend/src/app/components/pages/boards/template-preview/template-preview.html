@let p = preview();
<svg
  class="h-full w-full"
  [attr.viewBox]="`-2 -2 ${p.width + 4} ${p.height + 4}`"
  preserveAspectRatio="xMidYMid meet"
  aria-hidden="true"
  data-testid="preview-svg"
>
  @for (shape of p.shapes; track $index) {
    <rect
      [attr.x]="shape.x"
      [attr.y]="shape.y"
      [attr.width]="shape.w"
      [attr.height]="shape.h"
      [attr.rx]="shape.kind === 'text' ? 0.5 : 2"
      [attr.fill]="shape.fill"
      [attr.stroke]="shape.kind === 'frame' ? '#cbd5e1' : 'none'"
      stroke-width="0.8"
    />
  }
</svg>
