<drawboard-modal heading="About Drawboard" (closed)="closed.emit()">
  <p class="text-sm font-semibold" data-testid="about-name">
    Drawboard <span class="font-normal text-(--color-st-grey)">{{ config.version }}</span>
  </p>
  <p class="mt-1 text-sm">A self-hosted collaborative whiteboard.</p>

  <div class="mt-4 flex flex-col gap-2">
    @if (config.aboutUrl; as aboutUrl) {
      <a
        [href]="aboutUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="btn st-btn-primary-yellow"
        data-testid="about-host-link"
        >Host your own Drawboard</a
      >
    }
    <a
      [href]="config.sourceUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-ghost"
      data-testid="about-source-link"
      >Source code (AGPL-3.0)</a
    >
  </div>

  <p class="mt-4 text-xs text-(--color-st-grey)">
    Drawboard is free software under the GNU AGPL-3.0.
    <a
      [href]="licenseUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="underline underline-offset-2"
      >Licence text</a
    >
  </p>
</drawboard-modal>
