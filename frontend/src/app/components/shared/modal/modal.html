<div class="modal modal-open" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">
  <div
    class="modal-box float-panel max-h-[90dvh]"
    [class.max-w-md]="!wide()"
    [class.max-w-2xl]="wide()"
  >
    <div class="flex items-start justify-between gap-4">
      <h2 [id]="titleId" class="text-lg font-semibold">{{ heading() }}</h2>
      <button
        #closeButton
        type="button"
        class="btn btn-square btn-sm btn-ghost"
        aria-label="Close"
        (click)="closed.emit()"
      >
        <drawboard-icon name="close" />
      </button>
    </div>
    <div class="mt-4">
      <ng-content />
    </div>
  </div>
  <button
    type="button"
    class="modal-backdrop"
    tabindex="-1"
    aria-label="Close dialog"
    (click)="closed.emit()"
  ></button>
</div>
