# =============================================================================
# drawboard backend - production (Portainer stack "drawboard-backend" on unraid, endpoint 4)
#
# Only by a click on deploy:prod (component deploy-portainer, when: manual): it sets
# APP_IMAGE in the stack environment to the image that ran on dev. Never without asking
# Georg first (house rule). The stack is a
# Portainer GIT stack of THIS file on main (gitlab-devops scripts/24-drawboard-stacks.sh,
# deploy token portainer-stacks of the group apps): Portainer fetches changes every
# 5 minutes by itself - never edit it in the Portainer editor.
#
# Stack environment in Portainer (not in this file):
#   APP_IMAGE              set by deploy:prod
#   DB_PASSWORD            own value for prod, generated by the script, never printed
#   DRAWBOARD_ADMIN_GROUP  optional: Authelia group whose members are instance admins
#                          (empty = nobody; admin grants no access to boards)
#   SECRETS_DIR            directory ON THE HOST with the two secret files of the backend (S7.8), owned
#                          by uid 10001 (the user of the image), mode 0400, outside every repository:
#                            file_url_keys          signing keys of the file URLs (S4.4): one or more
#                                                   base64 keys of >= 32 random bytes, comma or line
#                                                   separated; the FIRST signs, ALL verify (rotation:
#                                                   new key first, old one out after an hour)
#                            plugin_pseudonym_key   the secret of the pseudonymous user ids plugins
#                                                   see (S3.8): base64 of >= 32 random bytes; a
#                                                   secret of its own, NEVER the same as file_url_keys
#                          Create with: `head -c 32 /dev/urandom | base64 > <file>` (once per file).
#
#   db                 PostgreSQL 18, database "drawboard"; one schema per module, created
#                      by the app's Flyway - not here. No host port (S7.8).
#   drawboard-backend  API and the collaboration WebSocket on 8080 in the container, no host
#                      port: only the frontend's nginx reaches it, over the network
#                      "drawboard" that this stack creates. Actuator on 8081 (container
#                      only, health check). The uploaded files live on a volume (/data/files).
#   gotenberg          LibreOffice in a container: converts Office documents to PDF (S4.10). On a network
#                      of its own with `internal: true` - NO route out, reachable only from the backend.
#
# Sign-in: Authelia (https://sso.dergeorg.at) as the OIDC provider, client "drawboard"
# (homelab script authelia-drawboard.sh). Switching to the central Keycloak later means
# changing OIDC_ISSUER_URI only (and the client id in the frontend stack).
# Security decisions: docs/architecture.md section 8 of the app (S6, S7.8). Before guests or
# third-party plugins are switched on here, see "Before enabling in production" there.
#
# Data: /srv/drawboard/postgres (ZFS dataset cache/appdata, in the appdata
# backup). Backups with a tested restore are an operational prerequisite (S7.7).
# =============================================================================
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drawboard
      POSTGRES_USER: drawboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the stack environment}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # PostgreSQL 18 keeps PGDATA in /var/lib/postgresql/18/docker -> mount the parent.
      - /srv/drawboard/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawboard -d drawboard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  drawboard-backend:
    image: ${APP_IMAGE:?APP_IMAGE missing - set by deploy:prod of the backend pipeline}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Alloy: Loki label service_name and ECS parsing of the JSON log lines.
      at.dergeorg.service: drawboard-backend
      at.dergeorg.log-format: ecs
    # S7.8: non-root (the image runs as uid 10001), read-only root file system, no extra
    # capabilities. Writable: /tmp (JVM files and the multipart spool, below) - a disk-backed volume, not a tmpfs (S2.8) -
    # and /data/files (the files). Spring writes an upload to a temp file before the handler runs; what may reach that spool
    # is decided from the request headers first (UploadGuardWebFilter: Content-Length required, 500 MB / 51 MB / 21 MB per
    # route, 2 uploads in flight per user, 8 in the instance) - so the spool never holds more than 8 x 501 MB (README,
    # "Uploads"), and nginx caps the request to match. A volume cannot be size-limited with the local driver; that arithmetic
    # is the bound, keep 5 GB free on the disk behind it.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - tmp:/tmp
      # The uploaded files (S4). The container runs as uid 10001: the directory must be writable for it.
      # Backups with a tested restore: this directory is part of them (S7.7).
      - /srv/drawboard/files:/data/files
    secrets: [file_url_keys, plugin_pseudonym_key, guest_signing_keys]
    environment:
      APP_ENVIRONMENT: prod
      TZ: Europe/Vienna
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: drawboard
      DB_USER: drawboard
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the stack environment}
      OIDC_ISSUER_URI: https://sso.dergeorg.at
      OIDC_AUDIENCE: drawboard-api
      OIDC_CLAIM_USERNAME: preferred_username
      OIDC_CLAIM_GROUPS: groups
      DRAWBOARD_ADMIN_GROUP: ${DRAWBOARD_ADMIN_GROUP:-}
      # The WebSocket handshake accepts exactly this Origin (S2.2).
      # S7.3: the proxies whose X-Forwarded-For counts for rate limits and audit (client address): the
      # frontend's nginx on this stack's network and NPM (192.0.2.4), the hop before it. Both must be
      # listed, or every client looks like a proxy. See README, "Proxies". Anything else is NOT trusted.
      DRAWBOARD_TRUSTED_PROXIES: "172.31.251.0/24,192.0.2.4/32"
      # Guest links (visitors without an account, S1). The switch is the stack variable GUESTS_ENABLED (default
      # false): set it to true in Portainer only when the checklist in docs/architecture.md ("Before enabling in
      # production", M2/M4 reviews) is done. The signing key is a FILE secret (S7.8) in SECRETS_DIR, made once by
      # gitlab-devops script 27 (EC P-256, PKCS#8 PEM; README "Guests" for rotation); it is mounted even while
      # guests are off, so switching on needs no compose change.
      DRAWBOARD_GUESTS_ENABLED: ${GUESTS_ENABLED:-false}
      DRAWBOARD_GUEST_SIGNING_KEYS_FILE: /run/secrets/guest_signing_keys
      # Files and plugins (S3, S4): where the bytes are, the keys (secret FILES, S7.8) and the converter.
      DRAWBOARD_FILES_DIR: /data/files
      # Where Spring spools multipart uploads (S2.8, M3 review MUST 1): a directory of its own on the tmp volume, created and
      # emptied by the application at the start.
      DRAWBOARD_UPLOAD_SPOOL_DIR: /tmp/spool
      DRAWBOARD_FILE_URL_KEYS_FILE: /run/secrets/file_url_keys
      DRAWBOARD_PLUGIN_PSEUDONYM_KEY_FILE: /run/secrets/plugin_pseudonym_key
      DRAWBOARD_GOTENBERG_URL: http://gotenberg:3000
      # Malware scan (S4.12, optional, off here): DRAWBOARD_CLAMAV_HOST=<clamd on an `internal: true` network like gotenberg>.
      # With DRAWBOARD_CLAMAV_FAIL_CLOSED=true, DRAWBOARD_CLAMAV_MAX_BYTES AND clamd's StreamMaxLength, MaxFileSize and MaxScanSize
      # (clamd.conf) must each be at least the video cap (files.max-video-bytes, default 524288000): a larger file is refused
      # with 413 (our limit) or by clamd's ERROR (503). The backend warns at start when its own limit is lower.
      # Plugin origin (S3.4): plugin assets and frame documents are handed out as URLs on this origin, and the frame CSP
      # names it. It is the frontend's nginx container under a second host name, which serves only /plugin-assets/ there
      # (and never on the app host). The same value is PLUGIN_ORIGIN of the frontend stack: roll out the frontend (and its
      # proxy host) first, or the plugin frames point at a host that does not answer yet.
      # Files from an own origin (S4.6, DRAWBOARD_FILES_ORIGIN) stay a SHOULD for later. Third-party plugins only after
      # "Before enabling in production".
      DRAWBOARD_PLUGIN_ORIGIN: https://draw-plugins.dergeorg.at
      DRAWBOARD_PUBLIC_URL: https://draw.dergeorg.at
      # Observability: Alloy on unraid -> LAN IP of the host. The OTLP export stays off until
      # that Alloy has its OTLP receiver (spring-kotlin-monitoring rollout); then set
      # OTEL_EXPORT_ENABLED=true in the stack.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.0.2.4:4318
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTEL_EXPORT_ENABLED:-false}
    healthcheck:
      # Readiness on the management port. The image has neither curl nor wget -> bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf "GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "\"status\":\"UP\"" <&3'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      default:
      drawboard:
        aliases: [drawboard-backend]
      conversion:

  # LibreOffice as a service (S4.10): converts Office documents to PDF for the backend, nothing else. It is on a network
  # of its own with `internal: true` (no route to anywhere else, not even the other containers of this stack), reachable
  # only from the backend; Chromium routes, the PDF engines' routes and webhooks are off, so the ONLY route left is
  # POST /forms/libreoffice/convert - the one the backend uses. Non-root (uid 1001 of the image), read-only root file
  # system with tmpfs for what LibreOffice writes, no capabilities, memory and process limits. The tag is pinned (Renovate
  # moves it); latest 8.x at the time of writing is 8.40.0.
  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    restart: unless-stopped
    user: "1001:1001"
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --pdfengines-disable-routes=true
      - --webhook-disable=true
      - --api-timeout=60s
      - --api-disable-health-check-logging=true
      - --libreoffice-restart-after=20
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
      - /home/gotenberg:size=128m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    labels:
      at.dergeorg.service: drawboard-gotenberg
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - conversion

networks:
  # backend <-> gotenberg and nothing else; `internal` = no route out (S4.10)
  conversion:
    name: drawboard-conversion
    internal: true
  drawboard:
    name: drawboard
    # Fixed subnet: DRAWBOARD_TRUSTED_PROXIES names it, so the frontend's nginx (the only container that
    # joins this network) is a trusted proxy and nothing else is.
    ipam:
      config:
        - subnet: 172.31.251.0/24

volumes:
  tmp:

secrets:
  # Files on the host, outside the repository (S7.8); see SECRETS_DIR in the header.
  file_url_keys:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the host directory with file_url_keys and plugin_pseudonym_key}/file_url_keys
  plugin_pseudonym_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the host directory with file_url_keys and plugin_pseudonym_key}/plugin_pseudonym_key
  guest_signing_keys:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the host directory with the secret files}/guest_signing_keys
