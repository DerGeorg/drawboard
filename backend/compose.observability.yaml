# =============================================================================
# drawboard – optional local observability stack (LOCAL ONLY)
#
#   docker compose -f compose.yaml -f compose.observability.yaml up -d
#
# Mirrors the planned dergeorg production design (research D-otel-infra):
#   app ──OTLP (traces, metrics)──► alloy :4317/:4318
#                                     ├─ traces  ► tempo  (metrics-generator ─RW─► prometheus)
#                                     ├─ metrics ► prometheus /api/v1/otlp
#                                     └─ logs    ► loki   /otlp  (not used by the app)
#   app container stdout (ECS JSON) ─► alloy (docker socket) ─► loki
#   app on the Mac: ECS log file dev/logs/*.log ─► alloy (file tail) ─► loki
#   browser (Angular frontend, Grafana Faro) ─► alloy faro.receiver :12347
#                                     ├─ logs/errors/vitals ► loki (job=faro)
#                                     └─ traces ► tempo (parent of the backend spans)
#   grafana: datasources prometheus / loki / tempo (fixed uids, cross-links),
#            dashboards folder "Services" (generated, 16 · Frontend = Faro)
#
# Host ports: 4317/4318 OTLP (Alloy), 12345 Alloy UI, 12347 Faro receiver, 13000 Grafana,
#             19090 Prometheus, 13100 Loki, 13200 Tempo. No 8080.
# Configs: dev/observability/. Details: dev/README.md.
# =============================================================================

services:
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "12345:12345"   # Alloy UI / self metrics
      - "12347:12347"   # faro.receiver (browser telemetry of the frontend)
    volumes:
      - ./dev/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # docker log collection
      - ./dev/logs:/var/log/host-apps:ro                # ECS log files of apps on the Mac (dev/README.md)
      - ./dev/sourcemaps:/var/sourcemaps:ro             # hidden source maps of the frontend image, per version
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - tempo
      - loki
      - prometheus
    healthcheck:
      # no curl/wget in the image -> bash /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'Alloy is ready' <&3
      interval: 5s
      timeout: 3s
      retries: 30

  tempo:
    image: grafana/tempo:3.1.1
    user: "10001:10001"
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "13200:3200"    # Tempo HTTP API (Grafana uses tempo:3200 in-network)
    volumes:
      - ./dev/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    # distroless image (no shell, no wget) -> no healthcheck; readiness:
    # curl localhost:13200/ready

  # named volumes are created root-owned; Tempo runs as 10001
  tempo-init:
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "13100:3100"
    volumes:
      - ./dev/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # distroless image (no shell, no wget) -> no healthcheck; readiness:
    # curl localhost:13100/ready

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "19090:9090"
    volumes:
      - ./dev/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # local only. Grafana 12.4 only allows the Viewer role for anonymous
      # users ("auth.anonymous.org_role is deprecated, only viewer role is
      # supported"), so: anonymous Viewer that may use Explore, plus a local
      # admin/admin login (UI + curl -u admin:admin) for everything else.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin     # local dev value
      GF_AUTH_BASIC_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:13000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/services/10-services.json
    ports:
      - "13000:3000"
    volumes:
      - ./dev/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  alloy-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
