# Tempo 3.1.0 – local dev copy of the planned dergeorg config (research D §2.2):
# monolithic (-target=all), local storage, no Kafka, metrics-generator with
# span-metrics + service-graphs remote-writing to Prometheus (with exemplars).
# Only difference to the prod plan: retention 48h instead of 336h.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"     # Tempo binds localhost by default
        http:
          endpoint: "0.0.0.0:4318"     # not published; in-network tests only

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions: ["deployment.environment.name"]
    span_metrics:
      dimensions: ["deployment.environment.name"]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: ["service-graphs", "span-metrics"]
      # classic histograms (dashboards use *_bucket); switch to "both" once
      # native histograms are wanted
      generate_native_histograms: classic
    compaction:
      block_retention: 48h

usage_report:
  reporting_enabled: false
