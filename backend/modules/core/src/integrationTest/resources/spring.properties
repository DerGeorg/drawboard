# Read by Spring itself (SpringProperties), not by Boot or JUnit: the test context cache of the integration tests.
#
# Every cached context keeps a whole application alive (~17 MiB with its management child context), and the test JVM has
# Gradle's default heap of 512 MiB. With Spring's default of 32 cached contexts the heap grew with every new context
# configuration until it was full: the estimation tests brought the 23rd and 24th, and the 51 MiB unpack of the plugin
# bomb test died with OutOfMemoryError inside the handler - the request never got an answer (TimeoutException).
#
# At most 8 contexts stay cached; the least recently used one is closed when a ninth is needed, and ContextRelease makes
# sure a closed one is really gone. Tests that share a configuration mostly run one after another, so an eviction rarely
# forces a rebuild.
spring.test.context.cache.maxSize=8
