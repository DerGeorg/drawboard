    post:
      operationId: createBoardShareLink
      summary: Create a share link for a board
      description: |
        Creates a link with a fresh 256-bit token (S1.1). The answer carries
        the link's URL with the token; it is the ONLY place the token ever
        appears - the server keeps just its hash. A link with audience
        `GUESTS` on an instance with guests disabled answers 403 `FORBIDDEN`.
        Only the `OWNER`.
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/NewShareLink'
      responses:
        '201':
          description: Created; the URL is shown only now.
