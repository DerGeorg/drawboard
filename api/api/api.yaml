        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
