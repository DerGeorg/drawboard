# All operations of the Drawboard API: ONE file, so IntelliJ's OpenAPI preview can
# render it. Referenced path by path from ../openapi.yaml (the path table).
# Rules (enforced by redocly.yaml and scripts/check-generated-models.mjs):
#   * no inline schemas and no own `components` here: every body is a $ref
#     into ../common/common.yaml#/components/schemas/
#   * every parameter is a $ref into ../common/common.yaml#/components/parameters/
#   * every 4xx/5xx is a $ref into ../common/common.yaml#/components/responses/
#     (application/problem+json, ErrorModel)
# 406 is listed wherever the operation answers with a body (the client's Accept
# header excludes application/json), 415 wherever it reads one.
# One comment block per resource (tag, backend module, subdomain); the paths
# of a resource stay together.
#
# Access: every operation needs a token unless it declares otherwise. Which
# boards and folders a user may see or change is decided by the sharing rules
# of module `library` (owner, editor, commenter, viewer; grants to users and
# groups, inherited from folders; share links); a board or folder the caller
# may not see answers 404, so its existence is not revealed.
#
# Guests (anonymous callers with a guest token from exchangeShareToken, S1.8)
# may call ONLY: getBoard, listBoards with `folderId` (the folder of their
# link), createCollabTicket, refreshGuestSession, listFiles, getFile,
# getFileUrls, getPluginStorage and listEnabledPlugins - each limited to the
# board or folder of their link and what lies below it. Every other operation
# answers a guest token with 403 FORBIDDEN. Enforced by the backend's route
# table; the operation descriptions repeat it. Since M4 (security review
# 2026-11-10) also listPokerRounds (state OPEN only), getPokerRound and
# castPokerVote - only for guests whose link role is COMMENTER or EDITOR;
# VIEWER-link guests get 403 on every poker operation.
openapi: 3.1.0
info:
  title: Drawboard API - operations
  # Never stamped: only the bundle of ../openapi.yaml carries the version.
  version: 0.0.0
paths:
  # ==========================================================================
  # boards - backend module `library`, subdomain `boards`
  # ==========================================================================
  /boards:
    get:
      operationId: listBoards
      summary: List the boards of a folder
      description: |
        One page of boards, most recently changed first. Without `folderId`:
        the boards in the root of the caller's own space (before folders
        existed this was every own board; boards created without a folder
        still are there). With `folderId`: the boards directly in that folder,
        which the caller owns or has at least the role `VIEWER` on (directly
        or inherited); otherwise 404 `LIBRARY_FOLDER_NOT_FOUND`. Boards in the
        trash are never listed. `role` is the caller's effective role.

        Guests: allowed with the `folderId` of their folder link or a folder
        below it (S1.8); without `folderId` 403 `FORBIDDEN`.
      tags: [boards]
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/BoardFolderFilter'
        - $ref: '../common/common.yaml#/components/parameters/PageNumber'
        - $ref: '../common/common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of boards.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/BoardPage'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    post:
      operationId: createBoard
      summary: Create a board
      description: |
        Creates an empty board owned by the signed-in user, in the root of
        their space or in `folderId` (a folder they own, else 404
        `LIBRARY_FOLDER_NOT_FOUND`), optionally as a template. The server
        assigns the id (UUIDv7). Importing a `.drawboard` file or a data URL,
        and a new board from a template, is this call plus the normal
        collaboration traffic; it needs no API of its own. Not for guests.
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/NewBoard'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new board.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Board'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /boards/{boardId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/BoardId'
    get:
      operationId: getBoard
      summary: Get a board
      description: |
        The board's metadata. Needs at least the role `VIEWER` on the board
        (own, granted, inherited from a folder, or through a link). A board in
        the trash answers 404 `LIBRARY_BOARD_NOT_FOUND`.

        Guests: allowed for the board of their board link, or a board in or
        below the folder of their folder link (S1.8).
      tags: [boards]
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Board'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    put:
      operationId: updateBoard
      summary: Rename a board or mark it as a template
      description: |
        Replaces the changeable metadata of a board (its title and, for the
        owner, whether it is a template). Optimistic locking: `version` is
        the version the client read last; if the board was changed in
        between, nothing is changed and the answer is 409 `CONFLICT`. Needs
        the role `EDITOR` or `OWNER`; changing `template` needs `OWNER` (403
        `FORBIDDEN` otherwise). Moving the board into another folder is
        moveBoard. Not for guests.
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/BoardUpdate'
      responses:
        '200':
          description: The updated board (with its new version).
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Board'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    delete:
      operationId: deleteBoard
      summary: Move a board to the trash
      description: |
        Moves the board to the owner's trash (soft delete, S7.7). Until M2
        this deleted the board at once; the wire format is unchanged, the
        board can now be restored with restoreBoard for 30 days and is purged
        for good afterwards (or at once with purgeBoard). While in the trash
        the board answers 404 on every board operation, its grants and links
        do not work (they work again after a restore), and open collaboration
        sessions are closed (close code 4404). Only the `OWNER` may do this.
      tags: [boards]
      responses:
        '204':
          description: Moved to the trash.
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /boards/{boardId}/folder:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/BoardId'
    put:
      operationId: moveBoard
      summary: Move a board into another folder
      description: |
        Moves the board into another folder of the owner's space, or into the
        root (`folderId: null`). Grants inherited from the old folder stop
        applying, those of the new folder apply from now on (open
        collaboration sessions are re-evaluated). Optimistic locking with
        `version` as in updateBoard (409 `CONFLICT`). A target folder the
        owner does not own or that is in the trash answers 404
        `LIBRARY_FOLDER_NOT_FOUND`. Only the `OWNER` may do this.
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/BoardMove'
      responses:
        '200':
          description: The moved board (with its new version).
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Board'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'

  # --- trash (boards and folders of the caller; module library) --------------
  /templates:
    get:
      operationId: listTemplates
      summary: List the templates the caller can use
      description: |
        One page of template boards (Board.template), most recently changed
        first: the caller's own (in any folder) and every template the
        caller has at least the role `VIEWER` on - shared directly, through
        a group of the current access token, through a link the caller
        opened while signed in, or inherited from a shared folder. Boards in
        the trash are never listed. `role` is the caller's effective role.
        The templates built into the frontend are not part of this list.
        Not for guests.
      tags: [boards]
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PageNumber'
        - $ref: '../common/common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of templates.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/BoardPage'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /trash:
    get:
      operationId: listTrash
      summary: List my trash
      description: |
        The caller's deleted boards and folders with `deletedAt`. Kept 30
        days after deletion, then purged automatically (S7.7). Not for guests.
      tags: [boards]
      responses:
        '200':
          description: The trash.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Trash'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /trash/boards/{boardId}/restore:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/BoardId'
    post:
      operationId: restoreBoard
      summary: Restore a board from the trash
      description: |
        Moves the board out of the trash, back into its folder - or into the
        root of the space when that folder is in the trash itself or gone.
        Its grants and links work again (links that expired meanwhile stay
        expired). A board that is not in the caller's trash answers 404
        `LIBRARY_BOARD_NOT_FOUND`. Only the `OWNER`.
      tags: [boards]
      responses:
        '200':
          description: The restored board.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Board'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /trash/boards/{boardId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/BoardId'
    delete:
      operationId: purgeBoard
      summary: Delete a board from the trash for good
      description: |
        Deletes a board that is in the trash now instead of after 30 days:
        drawing, update log, versions, grants and links (S7.7), and its
        planning poker rounds with their votes. Cannot be
        undone. A board that is not in the caller's trash answers 404
        `LIBRARY_BOARD_NOT_FOUND`. Only the `OWNER`.
      tags: [boards]
      responses:
        '204':
          description: Deleted for good.
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'

  # ==========================================================================
  # folders - backend module `library`, subdomain `folders`
  # ==========================================================================
  /folders:
    get:
      operationId: listFolders
      summary: List folders
      description: |
        Without `parentId`: every folder the caller owns, flat (the client
        builds the tree from `parentId`). With `parentId`: the direct
        subfolders of that folder, which the caller owns or has at least the
        role `VIEWER` on (else 404 `LIBRARY_FOLDER_NOT_FOUND`) - for browsing
        a folder shared with the caller. Folders in the trash are never
        listed. Not for guests.
      tags: [folders]
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/ParentFolderFilter'
      responses:
        '200':
          description: The folders.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/FolderList'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    post:
      operationId: createFolder
      summary: Create a folder
      description: |
        Creates a folder in the caller's own space, in the root or in
        `parentId` (a folder they own, else 404 `LIBRARY_FOLDER_NOT_FOUND`).
        The server assigns the id (UUIDv7). Not for guests.
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/NewFolder'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new folder.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Folder'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /folders/{folderId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/FolderId'
    get:
      operationId: getFolder
      summary: Get a folder
      description: |
        The folder's metadata. Needs at least the role `VIEWER` on the folder
        (own, granted, inherited, or through a link the caller opened while
        signed in). A folder in the trash answers 404
        `LIBRARY_FOLDER_NOT_FOUND`. Not for guests.
      tags: [folders]
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Folder'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    put:
      operationId: updateFolder
      summary: Rename or move a folder
      description: |
        Replaces name and parent of a folder (rename, move within the owner's
        space). Moving it into itself or a folder below it answers 409
        `LIBRARY_FOLDER_CYCLE`; a parent the owner does not own or that is in
        the trash 404 `LIBRARY_FOLDER_NOT_FOUND`. Optimistic locking with
        `version` (409 `CONFLICT`). Moving changes which inherited grants
        apply below the folder. Only the `OWNER` (403 `FORBIDDEN` for other
        roles).
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/common.yaml#/components/schemas/FolderUpdate'
      responses:
        '200':
          description: The updated folder (with its new version).
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Folder'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '415':
          $ref: '../common/common.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
    delete:
      operationId: deleteFolder
      summary: Move a folder to the trash
      description: |
        Moves the folder with everything below it (subfolders and boards) to
        the owner's trash, as one entry (soft delete, S7.7). Restorable for 30
        days with restoreFolder. While in the trash, its boards answer 404
        and open collaboration sessions on them are closed (4404). Only the
        `OWNER` (403 `FORBIDDEN` for other roles).
      tags: [folders]
      responses:
        '204':
          description: Moved to the trash.
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /trash/folders/{folderId}/restore:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/FolderId'
    post:
      operationId: restoreFolder
      summary: Restore a folder from the trash
      description: |
        Moves the folder with its content out of the trash, back under its
        parent - or into the root of the space when the parent is in the
        trash itself or gone. A folder that is not in the caller's trash
        answers 404 `LIBRARY_FOLDER_NOT_FOUND`. Only the `OWNER`.
      tags: [folders]
      responses:
        '200':
          description: The restored folder.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/Folder'
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'
  /trash/folders/{folderId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/FolderId'
    delete:
      operationId: purgeFolder
      summary: Delete a folder from the trash for good
      description: |
        Deletes a folder in the trash with everything below it now instead
        of after 30 days (boards as in purgeBoard). Cannot be undone. A folder
        that is not in the caller's trash answers 404
        `LIBRARY_FOLDER_NOT_FOUND`. Only the `OWNER`.
      tags: [folders]
      responses:
        '204':
          description: Deleted for good.
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../common/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'

  # ==========================================================================
  # sharing - backend module `library`, subdomain `sharing`
  # Members (grants to users and groups) and share links, for boards and
  # folders. OpenAPI has no generics, so both resources have their own paths.
  # Only the OWNER manages members and links; a folder's grants apply to
  # everything below it, and the strongest role a caller has wins.
  # ==========================================================================
  /boards/shared:
    get:
      operationId: listSharedWithMe
      summary: List what others shared with me
      description: |
        Boards and folders other users shared with the caller directly:
        user grants, grants to one of the groups of the caller's current
        access token (S6.5), and links the caller opened while signed in.
        Boards in a shared folder are listed with listBoards and `folderId`.
        Items in the trash are not listed. Not for guests.
      tags: [sharing]
      responses:
        '200':
          description: Shared with the caller.
          content:
            application/json:
              schema:
                $ref: '../common/common.yaml#/components/schemas/SharedWithMe'
        '401':
          $ref: '../common/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../common/common.yaml#/components/responses/Forbidden'
        '406':
          $ref: '../common/common.yaml#/components/responses/NotAcceptable'
        '500':
          $ref: '../common/common.yaml#/components/responses/InternalError'

  # --- members of a board ---------------------------------------------------
  /boards/{boardId}/members:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/BoardId'
    get:
      operationId: listBoardMembers
      summary: List the members of a board
      description: |
        The owner and every grant on the board, including those inherited from
        folders above it (`inheritedFrom`). Display names and usernames only,
        no email addresses (S6.9). Needs at least the role `VIEWER`; never for
        guests (S1.10).
      tags: [sharing]
