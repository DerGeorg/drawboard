          $ref: '../common/common.yaml#/components/responses/InternalError'
  /links/{linkId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/LinkId'
    delete:
      operationId: revokeShareLink
      summary: Revoke a share link
      description: |
        Revokes the link for good (S1.13): it never works again, guest
        requests with tokens from it fail within 30 seconds, and open
        collaboration sessions opened through it are closed (4403). Grants
        that signed-in users remembered through the link stay until the owner
        removes them. Guest participants of the link and their votes are
        removed from every `OPEN` planning poker round at once (which raises
        the round's `version`). Idempotent for an already revoked link. A link of
        another owner answers 404 `LIBRARY_SHARE_NOT_FOUND`. Only the `OWNER`
        of the board or folder.
      tags: [sharing]
      responses:
        '204':
          description: Revoked.
        '400':
          $ref: '../common/common.yaml#/components/responses/BadRequest'
