components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token of the OpenID Connect provider the deployment is bound to
        (central Keycloak by default, any standard OIDC provider by
        configuration). The token only identifies the user; what they may do
        with a board comes from the application's sharing rules. Guests send
        the app-signed guest token from `POST /shares/exchange` here as well
        (issuer `<public URL>/guest`); it opens only the guest allowlist.
    oidc:
      type: openIdConnect
      description: |
        Login through the OpenID Connect provider (authorization code + PKCE,
        public client `drawboard-web`). The discovery URL below points to the
        planned central Keycloak; the build writes the issuer of its
        configuration (`KEYCLOAK_ISSUER` in contract.env) into it, and a service
        that serves Swagger UI replaces it with its own issuer when it serves
        this document, so the login works against any provider.
      openIdConnectUrl: https://auth.dergeorg.at/realms/dergeorg/.well-known/openid-configuration
# Every operation needs a token unless it declares its own `security`
# (exchangeShareToken: anonymous allowed; downloadFile: no token, the signed
# URL authorises). Two entries = alternatives: a ready
# bearer token, or a login through the provider.
security:
  - bearerAuth: []
  - oidc: [openid]
