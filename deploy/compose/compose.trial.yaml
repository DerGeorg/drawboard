# Local trial: adds a Keycloak with three users (anna/anna, ben/ben, chris/chris) on
# http://localhost:8180. Start with
#   docker compose -f docker-compose.yml -f compose.trial.yaml --env-file trial/trial.env up -d
# then open http://localhost:8080. Throwaway setup for one machine - not for an installation
# others can reach (admin/admin, passwords = user names, plain HTTP).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
    ports:
      - "127.0.0.1:8180:8180"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "false"
    volumes:
      - ./trial:/config:ro
    restart: "no"
