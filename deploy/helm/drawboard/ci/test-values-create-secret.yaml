# The chart creates the key Secret from values (lab path), no Gotenberg, no PVC, no ingress-nginx
# annotations. The strings are placeholders, not keys.
publicUrl: https://draw.example.org
oidc:
  issuerUri: https://sso.example.org
  audience: drawboard-api
ingress:
  host: draw.example.org
  nginx:
    enabled: false
secrets:
  create: true
  values:
    fileUrlKeys: placeholder-file-url-keys
    pluginPseudonymKey: placeholder-pseudonym-key
files:
  persistence:
    enabled: false
gotenberg:
  enabled: false
postgresql:
  external:
    host: postgres.db.svc
    existingSecret: drawboard-db
