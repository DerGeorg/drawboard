{{- if .Values.secrets.create }}
{{- /* Opt-in, for labs: the chart creates the key files' Secret from secrets.values (pass them with
       --set-file, not in a values file). Recommended: secrets.existingSecret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drawboard.secretName" . }}
  labels:
    {{- include "drawboard.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.fileUrlKeys }}: {{ .Values.secrets.values.fileUrlKeys | quote }}
  {{ .Values.secrets.keys.pluginPseudonymKey }}: {{ .Values.secrets.values.pluginPseudonymKey | quote }}
  {{- if .Values.secrets.values.guestSigningKeys }}
  {{ .Values.secrets.keys.guestSigningKeys }}: {{ .Values.secrets.values.guestSigningKeys | quote }}
  {{- end }}
{{- end }}
