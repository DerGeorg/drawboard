{{- /* One ServiceAccount per component, none of them with a mounted API token. */ -}}
{{- $components := list "backend" "frontend" -}}
{{- if .Values.gotenberg.enabled }}{{ $components = append $components "gotenberg" }}{{ end }}
{{- if .Values.postgresql.enabled }}{{ $components = append $components "postgresql" }}{{ end }}
{{- range $component := $components }}
{{- $cv := index $.Values $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drawboard.componentName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "drawboard.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- with $cv.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
