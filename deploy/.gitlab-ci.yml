# =============================================================================
# Pipeline of the drawboard Helm chart (ci/components 2.19.0, component helm-chart)
#
#   push to a branch   version, chart:lint (helm lint --strict + helm template with every
#                      helm/drawboard/ci/*.yaml), chart:package (.tgz with the next version)
#   push to main       additionally: release (tag + GitLab release) when a feat:/fix: is due
#   publish            one click on chart:publish (main, release pipelines only):
#                      helm push to oci://ghcr.io/dergeorg/charts - never without asking Georg
#   schedule "GitHub sync" (nightly) or a click on sync:github: source snapshot to GitHub
#
# The chart version comes from the commit messages (semantic-release), not from Chart.yaml.
# ghcr.io credentials: group variables GHCR_USER / GHCR_TOKEN of apps/drawboard
# (gitlab-devops scripts/31-drawboard-ghcr.sh).
# =============================================================================

include:
  - component: $CI_SERVER_FQDN/ci/components/version@2.20.0
  - component: $CI_SERVER_FQDN/ci/components/helm-chart@2.20.0
    inputs:
      chart-dir: helm/drawboard
      registry: ghcr.io/dergeorg/charts
  - component: $CI_SERVER_FQDN/ci/components/release@2.20.0

stages: [version, lint, test, build, package, release, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_TAG                  # tags: no pipeline (semantic-release)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never                         # MR open: only the MR pipeline
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Source snapshot on GitHub (Fable review "Publishing the source", 2026-11-12): main of api,
# backend, frontend and deploy as one tree, scrubbed and checked with gitleaks, one commit to
# https://github.com/DerGeorg/drawboard when anything changed. Not a component: it is specific
# to this app (deviation recorded in CLAUDE.md). Nightly by the schedule "GitHub sync"
# (SYNC_GITHUB=true) and by hand on main. Token: GITHUB_SYNC_TOKEN (fine-grained, Contents
# read/write on that repository only; gitlab-devops scripts/32-drawboard-github-sync.sh).
# -----------------------------------------------------------------------------
sync:github:
  stage: deploy
  image: alpine:3.24
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_GITHUB == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  script:
    - apk add --no-cache git curl tar sed >/dev/null
    - sh scripts/github-sync.sh
